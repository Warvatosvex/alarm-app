name: Android APK Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20' # Assuming a recent node version is appropriate
      - name: Install dependencies (if needed)
        run: npm install # Only if node_modules is not committed
      - name: Capacitor Sync (if needed)
        run: npx cap sync android # Only if Capacitor is used and needs syncing
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
