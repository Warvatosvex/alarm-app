<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Smart Alarm</title>
<link rel="stylesheet" href="style.css">
<style>*{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button,input,select{min-height:44px}</style></head>
<body>

<div class="header">
  <div class="brand">⏰ Smart Alarm</div>
  <div class="clock" id="topClock">00:00:00</div>
</div>
<div class="status-bar" id="statusBar">🔔 Готов к работе</div>

<div class="tab-page active" id="page-alarms">
  <button type="button" class="btn-main" id="btnAddAlarm">＋ Добавить будильник</button>
  <button type="button" class="btn-main btn-test" id="btnTestAlarm">⚡ Тест звонка и заданий</button>
  <div class="list" id="alarmList"></div>
</div>

<div class="tab-page" id="page-series">
  <div class="card" style="display:block;">
    <div style="font-size:17px; font-weight:800; margin-bottom:12px;">🔁 Серия будильников по диапазону</div>
    <div class="row-2" style="margin-top:0; margin-bottom:12px;">
      <div class="fg" style="flex:1;"><label>Начало (С)</label><input type="time" class="inp" id="serStart" value="06:00"></div>
      <div class="fg" style="flex:1;"><label>Конец (До)</label><input type="time" class="inp" id="serEnd" value="07:25"></div>
    </div>
    <div class="fg"><label>Интервал (минут)</label><input type="number" class="inp" id="serStep" value="10" min="1" max="120"></div>
    <div id="serPreview" style="font-size:12px; color:var(--accent-light); margin-bottom:12px;"></div>
    <div class="fg"><label>Задание для серии</label>
      <select class="inp" id="serType">
        <option value="combo">🔥 Все 7 заданий по очереди</option>
        <option value="math">1. Математика</option><option value="code">2. Код тревоги</option>
        <option value="memory">3. Плитки памяти</option><option value="pairs">4. Найди пары</option>
        <option value="smash">5. Раздави мишени</option><option value="riddle">6. Загадка</option><option value="odd">7. Найди лишнее</option>
      </select>
    </div>
    <div class="fg"><label>Сложность (1-5): <span id="serDiffLbl">3</span></label><input type="range" id="serDiff" min="1" max="5" value="3" style="width:100%;"></div>
    <button type="button" class="btn-main" id="btnCreateSeries">Создать серию будильников</button>
  </div>
</div>

<div class="tab-page" id="page-timer">
  <div class="card" style="display:block; text-align:center;">
    <div style="font-size:13px; color:var(--muted);">ТАЙМЕР</div>
    <div id="tmDisplay" style="font-size:44px; font-weight:800; margin:14px 0;">00:05:00</div>
    <div class="row-2" style="margin-bottom:12px;">
      <button type="button" class="btn-main btn-sec tm-set" data-s="60">1 мин</button>
      <button type="button" class="btn-main btn-sec tm-set" data-s="300">5 мин</button>
      <button type="button" class="btn-main btn-sec tm-set" data-s="600">10 мин</button>
    </div>
    <div class="row-2">
      <button type="button" class="btn-main" id="btnTmStart">Старт</button>
      <button type="button" class="btn-main btn-sec" id="btnTmReset">Сброс</button>
    </div>
  </div>
</div>

<div class="tab-page" id="page-stopwatch">
  <div class="card" style="display:block; text-align:center;">
    <div style="font-size:13px; color:var(--muted);">СЕКУНДОМЕР</div>
    <div id="swDisplay" style="font-size:44px; font-weight:800; margin:14px 0;">00:00.00</div>
    <div class="row-2">
      <button type="button" class="btn-main" id="btnSwStart">Старт</button>
      <button type="button" class="btn-main btn-sec" id="btnSwLap">Круг</button>
      <button type="button" class="btn-main btn-sec" id="btnSwReset">Сброс</button>
    </div>
  </div>
  <div class="list" id="swLaps" style="margin-top:12px;"></div>
</div>

<nav class="bottom-nav">
  <button type="button" class="nav-item active" data-page="page-alarms"><span>⏰</span><span>Будильники</span></button>
  <button type="button" class="nav-item" data-page="page-series"><span>🔁</span><span>Серия</span></button>
  <button type="button" class="nav-item" data-page="page-timer"><span>⏳</span><span>Таймер</span></button>
  <button type="button" class="nav-item" data-page="page-stopwatch"><span>⏱️</span><span>Секундомер</span></button>
</nav>

<div class="modal" id="alarmModal">
  <div class="modal-box">
    <div class="modal-head"><span>Настройка будильника</span><span id="btnCloseModal" style="cursor:pointer;">✕</span></div>
    <div class="fg"><label>Время</label><input type="time" class="inp" id="mTime" value="07:30"></div>
    <div class="fg"><label>Название</label><input type="text" class="inp" id="mLabel" placeholder="Подъём"></div>
    <div class="fg"><label>Дни повтора</label>
      <div class="days" id="mDays">
        <button type="button" class="day-chip" data-d="1">Пн</button><button type="button" class="day-chip" data-d="2">Вт</button>
        <button type="button" class="day-chip" data-d="3">Ср</button><button type="button" class="day-chip" data-d="4">Чт</button>
        <button type="button" class="day-chip" data-d="5">Пт</button><button type="button" class="day-chip" data-d="6">Сб</button><button type="button" class="day-chip" data-d="0">Вс</button>
      </div>
    </div>
    <div class="fg"><label>Задание (7 видов + марафон)</label>
      <select class="inp" id="mType">
        <option value="combo">🔥 Все 7 заданий по очереди</option>
        <option value="math">1. Математика</option><option value="code">2. Код тревоги</option>
        <option value="memory">3. Плитки памяти</option><option value="pairs">4. Найди пары</option>
        <option value="smash">5. Раздави мишени</option><option value="riddle">6. Загадка</option><option value="odd">7. Найди лишнее</option>
      </select>
    </div>
    <div class="fg"><label>Сложность: <span id="mDiffLbl">3</span> • Раундов: <span id="mCntLbl">3</span></label>
      <div class="row-2" style="margin-top:4px;">
        <input type="range" id="mDiff" min="1" max="5" value="3">
        <input type="range" id="mCnt" min="1" max="10" value="3">
      </div>
    </div>
    <div class="fg"><label>Своя музыка (MP3/WAV)</label><input type="file" class="inp" id="mAudio" accept="audio/*" style="font-size:12px;"></div>
    <div class="row-2">
      <button type="button" class="btn-main btn-sec" id="btnCancelModal">Отмена</button>
      <button type="button" class="btn-main" id="btnSaveAlarm">Сохранить</button>
    </div>
    <button type="button" class="btn-main btn-test" id="btnDelAlarm" style="margin-top:10px; display:none;">Удалить</button>
  </div>
</div>

<div class="ring-screen" id="ringScreen">
  <div style="background:var(--danger); padding:4px 12px; border-radius:16px; font-size:11px; font-weight:800;">ТРЕВОГА • ВЫХОД ЗАБЛОКИРОВАН</div>
  <div id="rTime" style="font-size:42px; font-weight:900; margin:6px 0;">07:30</div>
  <div id="rTitle" style="color:#ff8fa3; font-weight:700;">Будильник</div>
  <div class="task-card">
    <div id="tStep" style="font-size:12px; color:var(--accent-light); font-weight:700;">Шаг 1</div>
    <div id="tQuest" style="font-size:19px; font-weight:800; margin:10px 0;">Задача</div>
    <div id="tErr" style="color:var(--danger); font-size:13px; font-weight:700; min-height:18px;"></div>
    <div id="tZone"></div>
  </div>
</div>

<script src="app.js"></script>
<script src='audio_pack.js'></script><script src='tasks_pack.js'></script><script src='super_ui.js'></script>  <script src="logic_25.js"></script>
</body>
</html>
